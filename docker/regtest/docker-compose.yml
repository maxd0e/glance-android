services:
  bitcoind:
    image: ruimarinho/bitcoin-core:26.0
    command:
      - -regtest=1
      - -server=1
      - -txindex=1
      - -fallbackfee=0.0002
      - -rpcuser=glance
      - -rpcpassword=glance-regtest-only
      - -rpcallowip=0.0.0.0/0
      - -rpcbind=0.0.0.0
    ports:
      - "18443:18443"
      - "18444:18444"
    volumes:
      - bitcoin-regtest:/home/bitcoin/.bitcoin

  electrs:
    image: ghcr.io/romanz/electrs:v0.10.9
    depends_on:
      - bitcoind
    command:
      - --network=regtest
      - --daemon-rpc-addr=bitcoind:18443
      - --daemon-p2p-addr=bitcoind:18444
      - --electrum-rpc-addr=0.0.0.0:50001
      - --db-dir=/data
    ports:
      - "50001:50001"
    volumes:
      - electrs-regtest:/data

volumes:
  bitcoin-regtest:
  electrs-regtest:

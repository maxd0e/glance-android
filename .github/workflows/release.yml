name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing Git tag to build or republish
        required: true
        type: string
      zapstore_channel:
        description: Zapstore release channel
        required: true
        default: main
        type: choice
        options:
          - main
          - beta

permissions:
  contents: write

jobs:
  release:
    name: Build and publish signed release
    runs-on: ubuntu-latest
    environment: release
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      ZAPSTORE_CHANNEL: ${{ inputs.zapstore_channel || (contains(github.ref_name, '-beta.') && 'beta' || 'main') }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.release_tag || github.ref_name }}
          fetch-depth: 0
      - name: Verify tagged source
        run: |
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"
          tagCommit="$(git rev-list -n 1 "refs/tags/$RELEASE_TAG")"
          test -n "$tagCommit"
          test "$(git rev-parse HEAD)" = "$tagCommit"
      - name: Set up JDK 21
        id: java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - name: Install Android build dependencies
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0"
      - name: Verify Gradle JVM
        env:
          JAVA_HOME: ${{ steps.java.outputs.path }}
        run: |
          java -version
          gradleVersion="$(./gradlew --no-daemon -Dorg.gradle.java.home="$JAVA_HOME" --version)"
          printf '%s\n' "$gradleVersion"
          grep -q 'JVM:.*21\.' <<< "$gradleVersion"
      - name: Build, verify, and sign release APK
        env:
          JAVA_HOME: ${{ steps.java.outputs.path }}
          GLANCE_RELEASE_KEYSTORE_BASE64: ${{ secrets.GLANCE_RELEASE_KEYSTORE_BASE64 }}
          GLANCE_RELEASE_STORE_PASSWORD: ${{ secrets.GLANCE_RELEASE_STORE_PASSWORD }}
          GLANCE_RELEASE_KEY_ALIAS: ${{ secrets.GLANCE_RELEASE_KEY_ALIAS }}
          GLANCE_RELEASE_KEY_PASSWORD: ${{ secrets.GLANCE_RELEASE_KEY_PASSWORD }}
          GLANCE_DONATION_ON_CHAIN: ${{ secrets.GLANCE_DONATION_ON_CHAIN }}
          GLANCE_DONATION_LIGHTNING: ${{ secrets.GLANCE_DONATION_LIGHTNING }}
          GLANCE_DIRECTORY_PUBLIC_KEY_BASE64: ${{ secrets.GLANCE_DIRECTORY_PUBLIC_KEY_BASE64 }}
        run: |
          keyStorePath="$RUNNER_TEMP/glance-release.jks"
          printf '%s' "$GLANCE_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keyStorePath"
          export GLANCE_RELEASE_STORE_FILE="$keyStorePath"
          ./gradlew --no-daemon -Dorg.gradle.java.home="$JAVA_HOME" -PglanceVersionName="${RELEASE_TAG#v}" verifyReleaseConfiguration :app:assembleRelease :app:lintRelease :app:testDebugUnitTest :core-crypto:test :core-network:test :core-data:test :core-security:test :app:verifyReleaseLoggingStripped
          mv app/build/outputs/apk/release/app-release.apk "glance-${RELEASE_TAG}.apk"
          sha256sum "glance-${RELEASE_TAG}.apk" > "glance-${RELEASE_TAG}.apk.sha256"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prereleaseArgs=()
          if [[ "$RELEASE_TAG" == *-beta.* ]]; then prereleaseArgs+=(--prerelease); fi
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" "glance-${RELEASE_TAG}.apk" "glance-${RELEASE_TAG}.apk.sha256" --verify-tag "${prereleaseArgs[@]}" --title "Glance $RELEASE_TAG" --generate-notes
          else
            gh release upload "$RELEASE_TAG" "glance-${RELEASE_TAG}.apk" "glance-${RELEASE_TAG}.apk.sha256" --clobber
          fi
      - name: Verify GitHub release artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir "$RUNNER_TEMP/release-check"
          gh release download "$RELEASE_TAG" --pattern "glance-${RELEASE_TAG}.apk" --dir "$RUNNER_TEMP/release-check"
          cmp "glance-${RELEASE_TAG}.apk" "$RUNNER_TEMP/release-check/glance-${RELEASE_TAG}.apk"
      - name: Install Zapstore publisher
        if: vars.ZAPSTORE_PUBLISH_ENABLED == 'true'
        run: go install github.com/zapstore/zsp@v0.4.17
      - name: Validate Zapstore release source
        if: vars.ZAPSTORE_PUBLISH_ENABLED == 'true'
        run: |
          grep -Eq '^pubkey: npub1[0-9a-z]+$' zapstore.yaml
          zspPath="$(go env GOPATH)/bin/zsp"
          "$zspPath" publish --check zapstore.yaml
      - name: Publish to Zapstore channel
        if: vars.ZAPSTORE_PUBLISH_ENABLED == 'true'
        env:
          SIGN_WITH: ${{ secrets.ZAPSTORE_BUNKER_URL }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          zspPath="$(go env GOPATH)/bin/zsp"
          releaseCommit="$(git rev-parse HEAD)"
          "$zspPath" publish --quiet --overwrite-release --channel "$ZAPSTORE_CHANNEL" --commit "$releaseCommit" zapstore.yaml

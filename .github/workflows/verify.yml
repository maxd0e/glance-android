name: Verify

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Build, test, and lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        id: java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build dependencies
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Verify Gradle JVM
        env:
          JAVA_HOME: ${{ steps.java.outputs.path }}
        run: |
          java -version
          gradleVersion="$(./gradlew --no-daemon -Dorg.gradle.java.home="$JAVA_HOME" --version)"
          printf '%s\n' "$gradleVersion"
          grep -q 'JVM:.*17\.' <<< "$gradleVersion"

      - name: Build and lint
        env:
          JAVA_HOME: ${{ steps.java.outputs.path }}
        run: ./gradlew --no-daemon -Dorg.gradle.java.home="$JAVA_HOME" --warning-mode all build lint
